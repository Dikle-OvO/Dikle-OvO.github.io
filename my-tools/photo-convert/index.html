<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嵌入式图片取模工具 (Image to Hex Converter)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        .oled-preview {
            background-image: radial-gradient(#34d399 15%, transparent 16%),
            radial-gradient(#34d399 15%, transparent 16%);
            background-size: 4px 4px;
            background-color: #000;
        }
        
        canvas {
            image-rendering: pixelated; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Internal Icon Definitions
        const icons = {
            Cpu: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><path d="M9 1v3"></path><path d="M15 1v3"></path><path d="M9 20v3"></path><path d="M15 20v3"></path><path d="M20 9h3"></path><path d="M20 14h3"></path><path d="M1 9h3"></path><path d="M1 14h3"></path></svg>,
            Github: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>,
            Image: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>,
            Upload: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
            Settings: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>,
            Monitor: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>,
            Code: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>,
            Copy: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>,
            Link: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>,
            Unlink: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>,
            Sliders: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>,
        };

        const Icon = ({ name, size = 20, className }) => {
            const SvgIcon = icons[name];
            if (!SvgIcon) return null;
            return <SvgIcon width={size} height={size} className={className} />;
        };

        // Dithering Matrices
        const bayer4x4 = [
            [ 0,  8,  2, 10],
            [12,  4, 14,  6],
            [ 3, 11,  1,  9],
            [15,  7, 13,  5]
        ];

        function App() {
            // State
            const [imageSrc, setImageSrc] = useState(null);
            const [originalSize, setOriginalSize] = useState({ width: 0, height: 0 });
            
            const [width, setWidth] = useState(128);
            const [height, setHeight] = useState(64);
            const [keepAspectRatio, setKeepAspectRatio] = useState(true);
            
            // Image Processing State
            const [threshold, setThreshold] = useState(128);
            const [brightness, setBrightness] = useState(0); // -100 to 100
            const [contrast, setContrast] = useState(0);     // -100 to 100
            const [ditherMode, setDitherMode] = useState('none'); // 'none', 'floyd', 'atkinson', 'bayer'
            const [invert, setInvert] = useState(false);
            
            // Configuration
            const [scanMode, setScanMode] = useState('vertical'); 
            const [bitOrder, setBitOrder] = useState('lsb'); 
            
            const [generatedCode, setGeneratedCode] = useState('');
            const [previewData, setPreviewData] = useState(null); 

            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);

            // Helpers
            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const result = event.target.result;
                        const img = new Image();
                        img.onload = () => {
                            setOriginalSize({ width: img.naturalWidth, height: img.naturalHeight });
                            setImageSrc(result);
                            if (keepAspectRatio) {
                                const ratio = img.naturalHeight / img.naturalWidth;
                                setHeight(Math.round(width * ratio));
                            }
                        };
                        img.src = result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleWidthChange = (e) => {
                const val = Math.max(1, parseInt(e.target.value) || 0);
                setWidth(val);
                if (keepAspectRatio && originalSize.width > 0) {
                    const ratio = originalSize.height / originalSize.width;
                    setHeight(Math.max(1, Math.round(val * ratio)));
                }
            };

            const handleHeightChange = (e) => {
                const val = Math.max(1, parseInt(e.target.value) || 0);
                setHeight(val);
                if (keepAspectRatio && originalSize.width > 0) {
                    const ratio = originalSize.width / originalSize.height;
                    setWidth(Math.max(1, Math.round(val * ratio)));
                }
            };

            const processImage = useCallback(() => {
                if (!imageSrc || !canvasRef.current) return;

                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.crossOrigin = "Anonymous";
                
                img.onload = () => {
                    // 1. Draw scaled image
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);

                    // 2. Get Data
                    const imageData = ctx.getImageData(0, 0, width, height);
                    const data = imageData.data;
                    const grayData = new Float32Array(width * height);
                    
                    // 3. Pre-process (Grayscale + Brightness + Contrast)
                    const contrastFactor = (259 * (contrast + 255)) / (255 * (259 - contrast));

                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        let gray = 0.299 * r + 0.587 * g + 0.114 * b;
                        
                        // Apply Contrast
                        gray = contrastFactor * (gray - 128) + 128;
                        
                        // Apply Brightness
                        gray = gray + brightness;

                        // Clamp
                        gray = Math.max(0, Math.min(255, gray));
                        
                        grayData[i / 4] = gray;
                    }

                    const pixels = new Uint8Array(width * height); // 0 or 1

                    // 4. Binarization / Dithering
                    if (ditherMode === 'none') {
                        for (let i = 0; i < grayData.length; i++) {
                            pixels[i] = grayData[i] < threshold ? 0 : 1;
                        }
                    } 
                    else if (ditherMode === 'bayer') {
                        // Ordered Dithering (Bayer 4x4)
                        for (let y = 0; y < height; y++) {
                            for (let x = 0; x < width; x++) {
                                const idx = y * width + x;
                                const gray = grayData[idx];
                                const mapValue = bayer4x4[y % 4][x % 4];
                                // Normalize map value (0-15) to 0-255 range approximately
                                const ditherThreshold = (mapValue + 0.5) * (255 / 16);
                                
                                // We can mix the user threshold slider slightly to shift bias
                                const bias = threshold - 128;
                                pixels[idx] = (gray + bias) < ditherThreshold ? 0 : 1;
                            }
                        }
                    }
                    else {
                        // Error Diffusion (Floyd-Steinberg or Atkinson)
                        // We need a mutable buffer for error propagation
                        const buffer = Float32Array.from(grayData);
                        
                        for (let y = 0; y < height; y++) {
                            for (let x = 0; x < width; x++) {
                                const idx = y * width + x;
                                const oldVal = buffer[idx];
                                // Usually dithering assumes 128 mid-point, but let's use user threshold for flexibility
                                const newVal = oldVal < threshold ? 0 : 255;
                                pixels[idx] = newVal === 0 ? 0 : 1;
                                
                                const error = oldVal - newVal;

                                if (ditherMode === 'floyd') {
                                    // Floyd-Steinberg
                                    // * 7
                                    // 3 5 1  (/16)
                                    if (x + 1 < width) buffer[idx + 1] += error * 7 / 16;
                                    if (y + 1 < height) {
                                        if (x - 1 >= 0) buffer[idx + width - 1] += error * 3 / 16;
                                        buffer[idx + width] += error * 5 / 16;
                                        if (x + 1 < width) buffer[idx + width + 1] += error * 1 / 16;
                                    }
                                } else if (ditherMode === 'atkinson') {
                                    // Atkinson (Cleaner, less worms)
                                    // * 1 1
                                    // 1 1 1
                                    //     1  (/8)
                                    const distribute = (targetIdx) => {
                                        buffer[targetIdx] += error / 8;
                                    };
                                    
                                    if (x + 1 < width) distribute(idx + 1);
                                    if (x + 2 < width) distribute(idx + 2);
                                    
                                    if (y + 1 < height) {
                                        if (x - 1 >= 0) distribute(idx + width - 1);
                                        distribute(idx + width);
                                        if (x + 1 < width) distribute(idx + width + 1);
                                    }
                                    if (y + 2 < height) {
                                        distribute(idx + 2 * width);
                                    }
                                }
                            }
                        }
                    }

                    // 5. Finalize Preview on Canvas & Invert
                    const viewData = ctx.createImageData(width, height);
                    for (let i = 0; i < pixels.length; i++) {
                        let val = pixels[i];
                        if (invert) val = val === 0 ? 1 : 0;
                        
                        // Update pixels array for code generation logic which expects 1=White/Lit
                        pixels[i] = val; 

                        const color = val === 1 ? 255 : 0;
                        viewData.data[i * 4] = color;
                        viewData.data[i * 4 + 1] = color;
                        viewData.data[i * 4 + 2] = color;
                        viewData.data[i * 4 + 3] = 255;
                    }
                    ctx.putImageData(viewData, 0, 0);

                    setPreviewData(pixels);
                    generateHex(pixels, width, height);
                };
                img.src = imageSrc;

            }, [imageSrc, width, height, threshold, invert, scanMode, bitOrder, brightness, contrast, ditherMode]);

            useEffect(() => {
                processImage();
            }, [processImage]);

            const generateHex = (pixels, w, h) => {
                let hexArray = [];
                
                if (scanMode === 'vertical') {
                    const pages = Math.ceil(h / 8);
                    for (let p = 0; p < pages; p++) {
                        for (let x = 0; x < w; x++) {
                            let byte = 0;
                            for (let bit = 0; bit < 8; bit++) {
                                let y = p * 8 + bit;
                                if (y < h) {
                                    const pixelIndex = y * w + x;
                                    const pixel = pixels[pixelIndex];
                                    if (pixel === 1) {
                                        if (bitOrder === 'lsb') {
                                            byte |= (1 << bit);
                                        } else {
                                            byte |= (1 << (7 - bit));
                                        }
                                    }
                                }
                            }
                            hexArray.push(byte);
                        }
                    }
                } else {
                    for (let y = 0; y < h; y++) {
                        for (let x = 0; x < w; x += 8) {
                            let byte = 0;
                            for (let bit = 0; bit < 8; bit++) {
                                if (x + bit < w) {
                                    const pixelIndex = y * w + (x + bit);
                                    const pixel = pixels[pixelIndex];
                                    if (pixel === 1) {
                                        if (bitOrder === 'msb') {
                                            byte |= (1 << (7 - bit));
                                        } else {
                                            byte |= (1 << bit);
                                        }
                                    }
                                }
                            }
                            hexArray.push(byte);
                        }
                    }
                }

                const hexString = hexArray.map(b => '0x' + b.toString(16).toUpperCase().padStart(2, '0'));
                
                let output = `// 图片尺寸: ${w}x${h}\n`;
                output += `// 取模方式: ${scanMode === 'vertical' ? '纵向取模 (Page Mode)' : '横向取模 (Horizontal)'}\n`;
                output += `// 字节序: ${bitOrder.toUpperCase()} First\n`;
                output += `// 数据长度: ${hexArray.length} 字节\n`;
                output += `const unsigned char bmp_data[] = {\n`;
                
                for (let i = 0; i < hexString.length; i += 16) {
                    output += "    " + hexString.slice(i, i + 16).join(", ") + ",\n";
                }
                
                output += `};`;
                setGeneratedCode(output);
            };

            const copyToClipboard = () => {
                if (!generatedCode) return;
                const fallbackCopy = () => {
                    const textArea = document.createElement("textarea");
                    textArea.value = generatedCode;
                    textArea.style.position = "fixed";
                    textArea.style.left = "-9999px";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try { document.execCommand('copy'); } catch (err) { console.error(err); }
                    document.body.removeChild(textArea);
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(generatedCode).catch(fallbackCopy);
                } else {
                    fallbackCopy();
                }
            };

            return (
                <div className="min-h-screen flex flex-col p-4 md:p-8 max-w-7xl mx-auto">
                    <header className="mb-8 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="p-3 bg-blue-600 rounded-lg shadow-lg shadow-blue-500/20">
                                <Icon name="Cpu" className="text-white" size={24} />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold text-white tracking-tight">OLED 取模工具</h1>
                                <p className="text-slate-400 text-sm">Embeded Image to Hex Converter</p>
                            </div>
                        </div>
                        <a href="#" onClick={(e) => { e.preventDefault(); alert("Made with React & Tailwind"); }} className="text-slate-500 hover:text-white transition-colors">
                            <Icon name="Github" size={20} />
                        </a>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        <div className="lg:col-span-4 space-y-6">
                            
                            {/* Upload */}
                            <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-5 backdrop-blur-sm">
                                <h2 className="flex items-center gap-2 text-lg font-semibold mb-4 text-blue-400">
                                    <Icon name="Image" size={18} /> 图片源
                                </h2>
                                <div 
                                    className="border-2 border-dashed border-slate-600 rounded-lg p-6 text-center hover:bg-slate-700/50 hover:border-blue-500 transition-all cursor-pointer group"
                                    onClick={() => fileInputRef.current.click()}
                                >
                                    <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={handleImageUpload} />
                                    {imageSrc ? (
                                        <div className="relative h-32 w-full flex items-center justify-center overflow-hidden rounded">
                                            <img src={imageSrc} className="max-h-full max-w-full object-contain opacity-80 group-hover:opacity-100 transition-opacity" alt="Source" />
                                            <div className="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <span className="text-white text-sm font-medium bg-black/60 px-3 py-1 rounded-full">更换图片</span>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="py-4">
                                            <Icon name="Upload" className="mx-auto text-slate-400 mb-2 group-hover:text-blue-400" size={32} />
                                            <p className="text-slate-300 text-sm">点击上传图片</p>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Image Processing Settings */}
                            <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-5 backdrop-blur-sm">
                                <h2 className="flex items-center gap-2 text-lg font-semibold mb-4 text-pink-400">
                                    <Icon name="Sliders" size={18} /> 图像处理
                                </h2>
                                <div className="space-y-4">
                                    {/* Dithering Mode */}
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-2">灰度抖动算法 (Dithering)</label>
                                        <select 
                                            value={ditherMode} 
                                            onChange={(e) => setDitherMode(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-pink-500"
                                        >
                                            <option value="none">无 (阈值二值化)</option>
                                            <option value="floyd">Floyd-Steinberg (平滑)</option>
                                            <option value="atkinson">Atkinson (清晰/细节)</option>
                                            <option value="bayer">Bayer Matrix (复古方格)</option>
                                        </select>
                                    </div>

                                    {/* Brightness */}
                                    <div>
                                        <div className="flex justify-between mb-1">
                                            <label className="text-xs text-slate-400">亮度 (Brightness)</label>
                                            <span className="text-xs text-pink-400 font-mono">{brightness > 0 ? '+' : ''}{brightness}</span>
                                        </div>
                                        <input 
                                            type="range" min="-100" max="100" 
                                            value={brightness} onChange={(e) => setBrightness(Number(e.target.value))}
                                            className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-pink-500"
                                        />
                                    </div>

                                    {/* Contrast */}
                                    <div>
                                        <div className="flex justify-between mb-1">
                                            <label className="text-xs text-slate-400">对比度 (Contrast)</label>
                                            <span className="text-xs text-pink-400 font-mono">{contrast > 0 ? '+' : ''}{contrast}</span>
                                        </div>
                                        <input 
                                            type="range" min="-100" max="100" 
                                            value={contrast} onChange={(e) => setContrast(Number(e.target.value))}
                                            className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-pink-500"
                                        />
                                    </div>
                                    
                                    {/* Threshold (Always visible as it biases dithering too) */}
                                    <div>
                                        <div className="flex justify-between mb-1">
                                            <label className="text-xs text-slate-400">二值化阈值 / 偏置 (Threshold)</label>
                                            <span className="text-xs text-pink-400 font-mono">{threshold}</span>
                                        </div>
                                        <input 
                                            type="range" min="0" max="255" 
                                            value={threshold} onChange={(e) => setThreshold(Number(e.target.value))}
                                            className="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-pink-500"
                                        />
                                    </div>
                                </div>
                            </div>

                            {/* Output Settings */}
                            <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-5 backdrop-blur-sm">
                                <h2 className="flex items-center gap-2 text-lg font-semibold mb-4 text-emerald-400">
                                    <Icon name="Settings" size={18} /> 输出配置
                                </h2>
                                <div className="space-y-4">
                                    {/* Dimensions */}
                                    <div className="grid grid-cols-[1fr,auto,1fr] gap-2 items-end">
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">宽度 (W)</label>
                                            <input type="number" value={width} onChange={handleWidthChange} className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-emerald-500" />
                                        </div>
                                        <button onClick={() => setKeepAspectRatio(!keepAspectRatio)} className={`mb-2 p-2 rounded transition-colors ${keepAspectRatio ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-400'}`} title="锁定长宽比">
                                            <Icon name={keepAspectRatio ? "Link" : "Unlink"} size={16} />
                                        </button>
                                        <div>
                                            <label className="block text-xs text-slate-400 mb-1">高度 (H)</label>
                                            <input type="number" value={height} onChange={handleHeightChange} className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white focus:outline-none focus:border-emerald-500" />
                                        </div>
                                    </div>

                                    {/* Size Info */}
                                    {imageSrc && (
                                        <div className="text-xs text-slate-500 flex justify-between px-1 bg-slate-900/50 p-2 rounded border border-slate-800">
                                            <span>原始: <span className="text-slate-300">{originalSize.width} x {originalSize.height}</span></span>
                                            <span>缩放: <span className="text-emerald-400">{width} x {height}</span></span>
                                        </div>
                                    )}

                                    {/* Toggles */}
                                    <div className="flex items-center justify-between p-3 bg-slate-900/50 rounded-lg border border-slate-700/50">
                                        <span className="text-sm text-slate-300">颜色反转 (Invert)</span>
                                        <button onClick={() => setInvert(!invert)} className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${invert ? 'bg-emerald-500' : 'bg-slate-600'}`}>
                                            <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${invert ? 'translate-x-6' : 'translate-x-1'}`} />
                                        </button>
                                    </div>

                                    <div className="border-t border-slate-700 my-4"></div>

                                    {/* Mode & Bit Order */}
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-2">取模方式 (Scan Mode)</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button onClick={() => setScanMode('vertical')} className={`px-3 py-2 text-sm rounded border transition-all ${scanMode === 'vertical' ? 'bg-blue-600/20 border-blue-500 text-blue-400' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'}`}>纵向 (SSD1306)</button>
                                            <button onClick={() => setScanMode('horizontal')} className={`px-3 py-2 text-sm rounded border transition-all ${scanMode === 'horizontal' ? 'bg-blue-600/20 border-blue-500 text-blue-400' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'}`}>横向 (Generic)</button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-2">字节序 (Bit Order)</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button onClick={() => setBitOrder('lsb')} className={`px-3 py-2 text-sm rounded border transition-all ${bitOrder === 'lsb' ? 'bg-purple-600/20 border-purple-500 text-purple-400' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'}`}>LSB First</button>
                                            <button onClick={() => setBitOrder('msb')} className={`px-3 py-2 text-sm rounded border transition-all ${bitOrder === 'msb' ? 'bg-purple-600/20 border-purple-500 text-purple-400' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'}`}>MSB First</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Preview & Output */}
                        <div className="lg:col-span-8 space-y-6">
                            <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-5 backdrop-blur-sm">
                                <h2 className="flex items-center gap-2 text-lg font-semibold mb-4 text-indigo-400">
                                    <Icon name="Monitor" size={18} /> 效果预览
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="flex flex-col items-center">
                                        <span className="text-xs text-slate-500 mb-2">二值化图像 ({width}x{height})</span>
                                        <div className="border border-slate-600 bg-slate-900 p-1 inline-block rounded shadow-inner">
                                            <canvas ref={canvasRef} width={width} height={height} className="max-w-full h-auto" style={{ minHeight: '64px' }} />
                                        </div>
                                    </div>
                                    <div className="flex flex-col items-center">
                                        <span className="text-xs text-slate-500 mb-2">OLED 仿真效果</span>
                                        <div className="relative p-2 bg-black rounded-lg border-4 border-slate-700 shadow-xl">
                                            <div className="oled-preview relative" style={{ width: width * 2, height: height * 2, maxWidth: '100%', aspectRatio: `${width}/${height}` }}>
                                                {imageSrc && (
                                                    <canvas id="sim-canvas" width={width} height={height} style={{ width: '100%', height: '100%', imageRendering: 'pixelated', filter: 'sepia(1) hue-rotate(70deg) saturate(3) brightness(1.2)' }} ref={(ref) => {
                                                        if (ref && canvasRef.current) {
                                                            const ctx = ref.getContext('2d');
                                                            ctx.imageSmoothingEnabled = false;
                                                            ctx.drawImage(canvasRef.current, 0, 0);
                                                        }
                                                    }} />
                                                )}
                                            </div>
                                            <div className="absolute inset-0 bg-gradient-to-tr from-white/5 to-transparent pointer-events-none rounded"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-5 backdrop-blur-sm flex-1 flex flex-col">
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="flex items-center gap-2 text-lg font-semibold text-orange-400">
                                        <Icon name="Code" size={18} /> C语言数组
                                    </h2>
                                    <button onClick={copyToClipboard} className="flex items-center gap-2 px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white text-sm rounded transition-colors">
                                        <Icon name="Copy" size={14} /> 复制
                                    </button>
                                </div>
                                <div className="relative flex-1">
                                    <textarea readOnly value={generatedCode} className="w-full h-64 md:h-80 bg-slate-950 border border-slate-800 rounded-lg p-4 font-mono text-xs md:text-sm text-slate-300 focus:outline-none focus:border-slate-600 resize-none" spellCheck="false" />
                                    <div className="absolute bottom-4 right-4 text-xs text-slate-600">Total: {generatedCode.split(',').length - 1} bytes</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
